name: Test read-only MIR platform
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Install pinned isolated SDK reference (scripts disabled)
        run: npm ci --prefix tools/rea/reference --ignore-scripts --no-audit --no-fund
      - run: npm run test:sdk
      - run: npm run test:sizing-reference
